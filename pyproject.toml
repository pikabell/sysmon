[project]
name = "sysmon"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Arjun Badola"}]
description = "A read-only Linux terminal monitor for CPU, memory, processes, GPUs, and network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0,<9",
]

classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
fast-sockets = ["psutil>=7.0"]
test = ["psutil>=7.0"]

[project.scripts]
sysmon = "sysmon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysmon"]

[project.urls]
Repository = "https://github.com/pikabell/sysmon"
Issues = "https://github.com/pikabell/sysmon/issues"

[tool.ruff.lint]
select = ["E9", "F", "B023"]
